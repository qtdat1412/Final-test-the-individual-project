<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - 1985 Café Trà Vinh</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Chung -->
    <link rel="stylesheet" href="css/style.css" id="theme-css">
    <style>
        body {
            background-color: #f4f1ea;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            text-align: center;
            color: #311c0f;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4a2e1b;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #8c6239;
            outline: none;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #311c0f;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover {
            background-color: #8c6239;
        }
        .back-home {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .back-home a {
            color: #8c6239;
            text-decoration: none;
            font-weight: 500;
        }
        .back-home a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Đăng Nhập Hệ Thống</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Tên đăng nhập hoặc Email</label>
                <input type="text" id="username" placeholder="Nhập 'admin' hoặc tên của bạn" required>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn-login">Đăng Nhập</button>
        </form>
        <div class="back-home">
            <a href="#" id="backHomeLink">&larr; Quay về trang chủ</a>
        </div>
    </div>

    <!-- Script xử lý phân quyền thông minh -->
    <script>
        // Tự động căn chỉnh đường dẫn CSS và Link trang chủ dựa theo vị trí file hiện tại
        const isSubFolder = window.location.pathname.includes('/html/');
        if (isSubFolder) {
            document.getElementById('theme-css').href = '../css/style.css';
            document.getElementById('backHomeLink').href = '../index.html';
        } else {
            document.getElementById('theme-css').href = 'css/style.css';
            document.getElementById('backHomeLink').href = 'index.html';
        }

        // Xử lý sự kiện Submit Form đăng nhập
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // 1. Phân quyền dành riêng cho ADMIN (Hỗ trợ cả 2 mật khẩu: '1412' hoặc '123456')
            if (username.toLowerCase() === 'admin' && (password === '1412' || password === '123456')) {
                // Xóa session cũ tránh xung đột
                localStorage.removeItem('isCustomerLoggedIn');
                localStorage.removeItem('customerName');
                
                // Lưu trạng thái Admin chuẩn xác
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('customerName', 'Quản trị viên');

                alert('Đăng nhập Quản trị Admin thành công!');
                window.location.href = isSubFolder ? '../admin.html' : 'admin.html';
                return;
            } 

            // 2. Phân quyền dành riêng cho KHÁCH HÀNG (Bất kỳ tên nào khác ngoài admin)
            if (username !== '' && password !== '') {
                // Xóa session Admin cũ
                localStorage.removeItem('isLoggedIn');

                // Lưu trạng thái Khách hàng chuẩn xác
                localStorage.setItem('isCustomerLoggedIn', 'true');
                localStorage.setItem('customerName', username);
                localStorage.setItem('userRole', 'customer');

                alert('Đăng nhập thành công! Chào mừng ' + username + '.');
                window.location.href = isSubFolder ? '../index.html' : 'index.html';
                return;
            }

            // 3. Trường hợp chưa nhập đủ thông tin
            alert('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!');
        });
    </script>

</body>
</html>
